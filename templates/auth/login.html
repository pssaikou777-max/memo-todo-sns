{% extends "base.html" %}
{% block title %}ログイン{% endblock %}
{% block page_title %}ログイン{% endblock %}
{% block content %}
<div style="max-width:360px;margin:32px auto">
  <h1 style="font-size:1.4rem;font-weight:700;margin-bottom:24px;text-align:center">
    メモ×todo×sns ログイン
  </h1>
  <form method="post">
    <div class="form-group">
      <label for="email">メールアドレス</label>
      <input class="form-control" type="email" id="email" name="email" required autocomplete="email">
    </div>
    <div class="form-group">
      <label for="password">パスワード</label>
      <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary btn-full">ログイン</button>
  </form>
  <p style="text-align:center;margin-top:16px;font-size:.85rem;color:var(--c-sub)">
    アカウントをお持ちでない方は
    <a href="{{ url_for('auth.register') }}" style="color:var(--c-accent)">新規登録</a>
  </p>
</div>
{% endblock %}
