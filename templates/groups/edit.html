{% extends "base.html" %}
{% block title %}{{ 'グループ編集' if group else 'グループ作成' }}{% endblock %}
{% block content %}

<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
  <a href="{{ url_for('groups.list_groups') }}" style="color:var(--c-sub);text-decoration:none;font-size:.9rem">← グループ</a>
  <h1 style="font-size:1rem;font-weight:700">{{ 'グループ編集' if group else 'グループ作成' }}</h1>
</div>

<form method="post">
  <div class="form-group">
    <label for="name">グループ名</label>
    <input class="form-control" type="text" id="name" name="name"
           value="{{ group.name if group else '' }}" required maxlength="64">
  </div>
  <button type="submit" class="btn btn-primary btn-full">
    {{ '更新する' if group else '作成する' }}
  </button>
</form>

{% endblock %}
