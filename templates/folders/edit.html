{% extends "base.html" %}
{% block title %}{{ 'フォルダ編集' if folder else 'フォルダ作成' }}{% endblock %}
{% block content %}

<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
  <a href="{{ url_for('folders.list_folders') }}" style="color:var(--c-sub);text-decoration:none;font-size:.9rem">← フォルダ</a>
  <h1 style="font-size:1rem;font-weight:700">{{ 'フォルダ編集' if folder else 'フォルダ作成' }}</h1>
</div>

<form method="post">
  <div class="form-group">
    <label for="name">フォルダ名</label>
    <input class="form-control" type="text" id="name" name="name"
           value="{{ folder.name if folder else '' }}" required maxlength="64">
  </div>
  <button type="submit" class="btn btn-primary btn-full">
    {{ '更新する' if folder else '作成する' }}
  </button>
</form>

{% endblock %}
